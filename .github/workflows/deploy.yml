name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # vagy master, attól függően melyik a fő branch-ed

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production, GitHub Pages base href)
        run: npx ng build --configuration production --base-href /Flashcards/

      - name: Add SPA fallback for client-side routing
        run: cp dist/flashcards/browser/index.html dist/flashcards/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/flashcards/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trello-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trello kártya azonosító kinyerése a commit üzenetből
        id: extract-card
        run: |
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP '#\K[0-9]+' | head -1 || true)
          CARD_ID=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('body') or '')")
            CARD_ID=$(echo "$PR_BODY" | grep -oP 'Trello-Card-Id:\s*\K\S+' || true)
          fi
          echo "card_id=$CARD_ID" >> "$GITHUB_OUTPUT"

      - name: Trello kártya lezárása (Done)
        if: steps.extract-card.outputs.card_id != ''
        run: |
          curl -sf -X PUT \
            "https://api.trello.com/1/cards/${{ steps.extract-card.outputs.card_id }}?idList=${{ vars.TRELLO_DONE_LIST_ID }}&key=${{ secrets.TRELLO_API_KEY }}&token=${{ secrets.TRELLO_TOKEN }}"
