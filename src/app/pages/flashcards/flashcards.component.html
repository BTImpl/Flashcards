@if (actual(); as actualWord) {
<div class="d-flex flex-column justify-content-between h-100 w-100">

  <app-word-card
      [word]="actualWord"
      (cardClicked)="flip()">
  </app-word-card>

  <app-navigation-footer
      (backClicked)="step(-1)"
      (nextClicked)="step(1)"
      [backDisabled]="actualWordIdx() <= 0"
      [nextDisabled]="actualWordIdx() + 1 >= shuffledWords().length">

      <h1 class="col-12" id="actualWord">
          {{ actualWordIdx() + 1}} / {{shuffledWords().length}}
      </h1>

  </app-navigation-footer>
</div>
} @else {
  <app-loading-state>{{ 'label.loading' | translate }}</app-loading-state>
}
